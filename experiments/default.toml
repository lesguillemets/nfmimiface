name = "表情模倣"
machine_name = "pc1"           # prepended to session IDs to tell machines apart
stimulus_side = "left"          # "left" | "right"
crop_scale = 2.5                # crop size relative to the detected face box
closing_message = "ご参加いただきありがとうございました！"
theme = "light"                 # optional: "light" (default) | "dark"; --theme overrides it

[camera]
index = 0
width = 1280
height = 720

# Optional: the closing page shows a QR code to this URL, with {session_id} replaced.
[form]
url = "https://docs.google.com/forms/d/e/1FAIpQLSeQ7I4DjUewX1jnKp26iWJPWS2Av-pc8EbD6Ss1yX7rNFmvVA/viewform?usp=pp_url&entry.148188974={session_id}"
caption = "フォームで入力"

[scorer]
name = "shape_strength"
# params = { ... }

# One trial per entry, in this order. Paths are relative to the project root.
[[stimuli]]
path = "stimuli/face01.jpg"
instruction = ""

# The message with the highest min_score not above the score is shown.
[[messages]]
min_score = 80.0
text = "すばらしい！ほぼ完璧です。"

[[messages]]
min_score = 60.0
text = "いい感じです！"

[[messages]]
min_score = 0.0
text = "もう少し！表情のポイントをよく見てみましょう。"
