[project]
name = "nfmimiface"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lesguillemets", email = "kgkacko+github@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mediapipe>=1.2.2",
    "opencv-python-headless>=5.0.0.93",
    "pyside6>=6.12.0",
]

[project.scripts]
nfmimiface = "nfmimiface:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.17.3",
]
