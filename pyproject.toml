[project]
name = "nfmimiface"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lesguillemets", email = "kgkacko+github@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mediapipe>=1.2.2",
    "opencv-python-headless>=5.0.0.93",
    "pyside6>=6.12.0",
]

[project.scripts]
nfmimiface = "nfmimiface.app:main"
nfmimiface-blendshapes = "nfmimiface.show_blendshapes:main"
nfmimiface-compare-scorers = "nfmimiface.compare_scorers:main"
nfmimiface-live-score = "nfmimiface.live_score:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.uv]
# mediapipe depends on opencv-contrib-python, which installs the same `cv2` package as
# opencv-python-headless (and bundles its own Qt on Linux, which conflicts with PySide6).
# mediapipe's FaceLandmarker does not need cv2, so we keep only the headless build.
override-dependencies = ["opencv-contrib-python; sys_platform == 'never'"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
